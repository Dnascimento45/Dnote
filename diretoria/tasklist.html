<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caderno de Tarefas</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --border-color: #30363d;
            --primary: #388bfd;
            --primary-hover: #1f6feb;
            --success-bg: rgba(46, 160, 67, 0.15);
            --success-border: #2ea043;
            --success-text: #3fb950;
            --pending-bg: rgba(187, 128, 9, 0.15);
            --pending-border: #bb8009;
            --pending-text: #e3b341;
            --danger: #f85149;
            --danger-hover: #da3633;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 25px;
            text-align: center;
        }

        header h1 {
            color: var(--text-main);
            margin-bottom: 5px;
            font-size: 26px;
        }

        header p {
            color: var(--text-muted);
            font-size: 14px;
            margin: 0;
        }

        .card-adicionar {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
        }

        .card-adicionar h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 16px;
            color: var(--text-main);
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .form-group input {
            flex: 1;
            padding: 10px 14px;
            background-color: #0d1117;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: var(--primary);
        }

        .btn-adicionar {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.2s;
        }

        .btn-adicionar:hover {
            background-color: var(--primary-hover);
        }

        .divisoria {
            background: var(--card-bg);
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            margin-bottom: 25px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .divisoria-header {
            padding: 15px 20px;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .divisoria-concluidas {
            border-left: 5px solid var(--success-border);
        }
        .divisoria-concluidas .divisoria-header {
            background-color: var(--success-bg);
            color: var(--success-text);
        }

        .divisoria-pendentes {
            border-left: 5px solid var(--pending-border);
        }
        .divisoria-pendentes .divisoria-header {
            background-color: var(--pending-bg);
            color: var(--pending-text);
        }

        .lista-tarefas {
            padding: 10px 20px;
            list-style: none;
            margin: 0;
            min-height: 40px;
            position: relative;
        }

        .tarefa-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 10px;
            border-bottom: 1px solid var(--border-color);
            gap: 15px;
            background: var(--card-bg);
            border-radius: 6px;
            margin-bottom: 5px;
            z-index: 1;
            transition: background 0.2s, box-shadow 0.2s;
        }

        .tarefa-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .drag-handle {
            color: var(--text-muted);
            font-size: 16px;
            cursor: grab;
            user-select: none;
            padding-right: 2px;
            touch-action: none; 
        }
        .drag-handle:active {
            cursor: grabbing;
        }

        .tarefa-item.dragging {
            background: var(--card-bg);
            border: 1px solid var(--primary);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            cursor: grabbing;
        }

        .tarefa-item.placeholder {
            background: rgba(56, 139, 253, 0.05);
            border: 1px dashed var(--primary);
            box-shadow: none;
            margin-bottom: 5px;
        }

        .tarefa-info {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            flex: 1;
        }

        .tarefa-info input[type="checkbox"] {
            margin-top: 4px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .tarefa-detalhes {
            display: flex;
            flex-direction: column;
            gap: 3px;
            flex: 1;
        }

        .tarefa-titulo {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-main);
            border: 1px solid transparent;
            padding: 2px 4px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .tarefa-titulo:focus {
            border-color: var(--primary);
            background: #0d1117;
        }

        .tarefa-obs {
            font-size: 12px;
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 2px 4px;
            border-radius: 4px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }

        .tarefa-obs:focus {
            border-color: var(--primary);
            background: #0d1117;
        }

        .badge-numero {
            background: var(--pending-bg);
            color: var(--pending-text);
            border: 1px solid var(--pending-border);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-right: 2px;
            display: inline-block;
            min-width: 20px;
            text-align: center;
        }

        .concluida-texto .tarefa-titulo {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .acoes-item {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-apagar {
            background-color: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .btn-apagar:hover {
            background-color: var(--danger);
            color: white;
            border-color: var(--danger);
        }

        .vazio {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Caderno Digital - Organização por Foco</h1>
        <p>Arraste pela alça (☰) para mover a tarefa para cima ou para baixo de forma perfeitamente fluida.</p>
    </header>

    <div class="card-adicionar">
        <h3>Adicionar Nova Tarefa ou Nota</h3>
        <div class="form-group">
            <input type="text" id="input-titulo" placeholder="Nome da tarefa..." onkeydown="if(event.key === 'Enter') adicionarTarefa()">
        </div>
        <div class="form-group">
            <input type="text" id="input-obs" placeholder="Observações ou detalhes (opcional)..." onkeydown="if(event.key === 'Enter') adicionarTarefa()">
            <button class="btn-adicionar" onclick="adicionarTarefa()">Adicionar</button>
        </div>
    </div>

    <div class="divisoria divisoria-concluidas">
        <div class="divisoria-header">
            <span>✨ Concluídas</span>
            <span id="contador-concluidas" style="font-size: 13px;">(0)</span>
        </div>
        <ul id="lista-concluidas" class="lista-tarefas"></ul>
    </div>

    <div class="divisoria divisoria-pendentes">
        <div class="divisoria-header">
            <span>⚡ Foco Atual & Próximos Passos (Pendentes)</span>
            <span id="contador-pendentes" style="font-size: 13px;">(0)</span>
        </div>
        <ul id="lista-pendentes" class="lista-tarefas"></ul>
    </div>
</div>

<script>
    const tarefasIniciais = [
        { id: 1, tarefa: "Header Global (Botão Voltar + Ferramentas)", obs: "Index.html ainda não atualizado! Reordenar elementos (Botão -> Logo -> Ferramentas) e corrigir stroke-width=\"w\" para \"2\".", status: "Pendente" },
        { id: 2, tarefa: "Layout do Caderno (Tela 3)", obs: "HTML base criado, mas CSS precisa garantir flex: 1 no caderno-body para preencher a tela.", status: "Pendente" },
        { id: 3, tarefa: "Lógica do Caderno (caderno.js)", obs: "Função renderizarCaderno criada, mas precisa integrar os eventos do header (mostrar ferramentas, esconder logo, mudar botão voltar).", status: "Pendente" },
        { id: 4, tarefa: "Ferramentas do Header (Mostrar/Ocultar)", obs: "Adicionar classe modo-caderno no body para controlar visibilidade das ferramentas e cor do botão voltar (não ficar vermelho).", status: "Pendente" },
        { id: 5, tarefa: "Vídeo da Página 2 para SVG em Loop", obs: "Substituir o vídeo do video-container por um SVG animado (já temos o arquivo SVG). Fazer ele girar continuamente em loop.", status: "Pendente" },
        { id: 6, tarefa: "Canvas \"Infinito\" (Pan & Zoom)", obs: "Implementar sistema de deslocamento (pan) que permita arrastar o canvas para qualquer direção, com \"infinito\" visual.", status: "Pendente" },
        { id: 7, tarefa: "Criação Dinâmica de Seções", obs: "Permitir ao usuário criar \"seções\" (subdivisões) em cada capítulo. Exigirá estrutura de dados e interface na sidebar.", status: "Pendente" },
        { id: 8, tarefa: "Botão \"Voltar ao Início\" / \"Viajar para Seção\"", obs: "Criar um botão que reseta a posição do canvas para o início (0,0) ou salta diretamente para uma seção específica.", status: "Pendente" },
        { id: 9, tarefa: "Desenho e Escrita (Ferramentas)", obs: "Implementar efetivamente as ferramentas de desenho (lápis), texto (escrever no canvas), e borracha inteligente.", status: "Pendente" },
        { id: 10, tarefa: "Salvar e Colar Imagens", obs: "Salvar o conteúdo do canvas (e/ou texto) no localStorage ou outro meio; suportar paste de imagens no canvas.", status: "Pendente" },
        { id: 11, tarefa: "Responsividade (PC)", obs: "Focar em PC por enquanto, mas garantir que o layout não quebre em resoluções comuns.", status: "Pendente" },
        { id: 12, tarefa: "Dashboard (Tela 1)", obs: "Grid 2x2, capas em SVG, hover fluido, som de hover, logo centralizada.", status: "Pronto" },
        { id: 13, tarefa: "Transição de Ida (Tela 1 → 2)", obs: "Efeito \"zoom out\" da dashboard inteira.", status: "Pronto" },
        { id: 14, tarefa: "Transição de Volta (Tela 2 → 1)", obs: "Zoom in + fade, com limpeza de estilos inline para repetição.", status: "Pronto" },
        { id: 15, tarefa: "Tela de Conteúdos (Tela 2)", obs: "Grid de conteúdos, vídeo em loop no canto.", status: "Pronto" },
        { id: 16, tarefa: "Estrutura de Dados (Capítulos aninhados)", obs: "dados.js atualizado com conteudos contendo id, nome e capitulos: [].", status: "Pronto" },
        { id: 17, tarefa: "Integração Navegação (Livro → Caderno)", obs: "livro.js atualizado para chamar renderizarCaderno.", status: "Pronto" },
        { id: 18, tarefa: "Geração de SVGs (Português/Inglês)", obs: "Já criados manualmente (conforme solicitado).", status: "Pronto" }
    ];

    function carregarTarefas() {
        const salvo = localStorage.getItem("tarefas_caderno_digital_v12");
        return salvo ? JSON.parse(salvo) : tarefasIniciais;
    }

    let tarefas = carregarTarefas();

    function salvarTarefas() {
        localStorage.setItem("tarefas_caderno_digital_v12", JSON.stringify(tarefas));
    }

    function adicionarTarefa() {
        const inputTitulo = document.getElementById("input-titulo");
        const inputObs = document.getElementById("input-obs");
        
        const titulo = inputTitulo.value.trim();
        const obs = inputObs.value.trim();

        if (!titulo) {
            alert("Por favor, informe o nome da tarefa!");
            inputTitulo.focus();
            return;
        }

        const maiorId = tarefas.reduce((max, t) => t.id > max ? t.id : max, 0);
        
        const novaTarefa = {
            id: maiorId + 1,
            tarefa: titulo,
            obs: obs || "Nota/tarefa adicionada manualmente.",
            status: "Pendente"
        };

        const concluidas = tarefas.filter(t => t.status === "Pronto");
        const pendentes = tarefas.filter(t => t.status === "Pendente");
        tarefas = [novaTarefa, ...pendentes, ...concluidas];
        
        salvarTarefas();

        inputTitulo.value = "";
        inputObs.value = "";
        inputTitulo.focus();

        renderizar();
    }

    function alternarStatus(id) {
        tarefas = tarefas.map(t => {
            if (t.id === id) t.status = t.status === "Pendente" ? "Pronto" : "Pendente";
            return t;
        });
        salvarTarefas();
        renderizar();
    }

    function apagarTarefa(id) {
        if (confirm("Deseja apagar esta tarefa?")) {
            tarefas = tarefas.filter(t => t.id !== id);
            salvarTarefas();
            renderizar();
        }
    }

    function atualizarTexto(id, campo, novoValor) {
        tarefas = tarefas.map(t => {
            if (t.id === id) t[campo] = novoValor.trim();
            return t;
        });
        salvarTarefas();
    }

    function renderizar() {
        const listaConcluidas = document.getElementById("lista-concluidas");
        const listaPendentes = document.getElementById("lista-pendentes");
        
        listaConcluidas.innerHTML = "";
        listaPendentes.innerHTML = "";

        const concluidas = tarefas.filter(t => t.status === "Pronto");
        const pendentes = tarefas.filter(t => t.status === "Pendente");

        document.getElementById("contador-concluidas").textContent = `(${concluidas.length})`;
        document.getElementById("contador-pendentes").textContent = `(${pendentes.length})`;

        if (concluidas.length === 0) {
            listaConcluidas.innerHTML = `<div class="vazio">Nenhuma tarefa concluída no momento.</div>`;
        } else {
            concluidas.forEach(t => listaConcluidas.appendChild(criarElementoTarefa(t, true, null)));
        }

        if (pendentes.length === 0) {
            listaPendentes.innerHTML = `<div class="vazio">Todas as tarefas foram concluídas!</div>`;
        } else {
            pendentes.forEach((t, index) => listaPendentes.appendChild(criarElementoTarefa(t, false, index + 1)));
        }
    }

    function criarElementoTarefa(t, isConcluida, numeroExibicao) {
        const li = document.createElement("li");
        li.className = `tarefa-item ${isConcluida ? 'concluida-texto' : ''}`;
        li.dataset.id = t.id;

        li.innerHTML = `
            <div class="tarefa-info">
                ${!isConcluida ? `<span class="drag-handle" title="Arraste para reordenar">☰</span><span class="badge-numero">${numeroExibicao}</span>` : ''}
                <input type="checkbox" ${isConcluida ? 'checked' : ''} onclick="alternarStatus(${t.id})" title="Marcar como concluída/pendente">
                <div class="tarefa-detalhes">
                    <span class="tarefa-titulo" contenteditable="true" onblur="atualizarTexto(${t.id}, 'tarefa', this.textContent)">${t.tarefa}</span>
                    <span class="tarefa-obs" contenteditable="true" onblur="atualizarTexto(${t.id}, 'obs', this.textContent)">${t.obs}</span>
                </div>
            </div>
            <div class="acoes-item">
                ${!isConcluida ? `<button class="btn-apagar" onclick="apagarTarefa(${t.id})">Apagar</button>` : ''}
            </div>
        `;
        return li;
    }

    function inicializarArrastoMotorizado() {
        const lista = document.getElementById("lista-pendentes");
        
        let arrastando = null;
        let placeholder = null;
        let startY = 0;
        let startTop = 0;

        lista.addEventListener('mousedown', iniciarArrasto);
        lista.addEventListener('touchstart', iniciarArrasto, { passive: false });

        function iniciarArrasto(e) {
            const handle = e.target.closest('.drag-handle');
            if (!handle) return;
            
            arrastando = handle.closest('.tarefa-item');
            if (!arrastando) return;

            e.preventDefault(); 
            
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const rect = arrastando.getBoundingClientRect();
            
            startY = clientY;
            startTop = rect.top;

            placeholder = document.createElement('li');
            placeholder.className = 'tarefa-item placeholder';
            placeholder.style.height = `${rect.height}px`;
            
            arrastando.parentNode.insertBefore(placeholder, arrastando.nextSibling);

            arrastando.style.position = 'fixed';
            arrastando.style.margin = '0';
            arrastando.style.zIndex = '9999';
            arrastando.style.width = `${rect.width}px`;
            arrastando.style.top = `${startTop}px`;
            arrastando.style.left = `${rect.left}px`;
            arrastando.style.pointerEvents = 'none'; 
            arrastando.style.transition = 'none';
            arrastando.style.transform = 'translateY(0px)';
            arrastando.classList.add('dragging');

            document.addEventListener('mousemove', moverArrasto);
            document.addEventListener('touchmove', moverArrasto, { passive: false });
            document.addEventListener('mouseup', soltarArrasto);
            document.addEventListener('touchend', soltarArrasto);
        }

        function moverArrasto(e) {
            if (!arrastando) return;
            e.preventDefault(); 

            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;

            const deltaY = clientY - startY;
            arrastando.style.transform = `translateY(${deltaY}px)`;

            const alvo = document.elementFromPoint(clientX, clientY);
            if (!alvo) return;

            const itemSobMouse = alvo.closest('.tarefa-item:not(.dragging):not(.placeholder)');
            if (itemSobMouse && itemSobMouse.parentNode === lista) {
                const rectAlvo = itemSobMouse.getBoundingClientRect();
                const meioY = rectAlvo.top + rectAlvo.height / 2;

                const irmaos = [...lista.querySelectorAll('.tarefa-item:not(.dragging)')];
                const antigasPosicoes = irmaos.map(el => ({ el, top: el.getBoundingClientRect().top }));

                if (clientY < meioY) {
                    if (placeholder.nextSibling !== itemSobMouse) {
                        lista.insertBefore(placeholder, itemSobMouse);
                    }
                } else {
                    if (placeholder.previousSibling !== itemSobMouse) {
                        lista.insertBefore(placeholder, itemSobMouse.nextSibling);
                    }
                }

                irmaos.forEach(item => {
                    const posNova = item.getBoundingClientRect().top;
                    const posAntiga = antigasPosicoes.find(p => p.el === item).top;
                    const deslizeY = posAntiga - posNova;

                    if (deslizeY !== 0) {
                        item.style.transition = 'none';
                        item.style.transform = `translateY(${deslizeY}px)`;
                        
                        item.offsetHeight; 
                        
                        item.style.transition = 'transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1)';
                        item.style.transform = '';
                        
                        item.addEventListener('transitionend', function handler() {
                            item.style.transition = '';
                            item.removeEventListener('transitionend', handler);
                        });
                    }
                });
            }
        }

        function soltarArrasto() {
            if (!arrastando) return;

            lista.insertBefore(arrastando, placeholder);
            
            arrastando.style = ''; 
            arrastando.classList.remove('dragging');
            
            placeholder.remove();
            
            arrastando = null;
            placeholder = null;

            document.removeEventListener('mousemove', moverArrasto);
            document.removeEventListener('touchmove', moverArrasto);
            document.removeEventListener('mouseup', soltarArrasto);
            document.removeEventListener('touchend', soltarArrasto);

            salvarNovaOrdem();
        }

        function salvarNovaOrdem() {
            const idsNaTela = [...lista.querySelectorAll(".tarefa-item")].map(el => Number(el.dataset.id));
            const pendentesReordenados = idsNaTela.map(id => tarefas.find(t => t.id === id));
            const concluidas = tarefas.filter(item => item.status === "Pronto");

            tarefas = [...pendentesReordenados, ...concluidas];
            salvarTarefas();
            renderizar(); 
        }
    }

    renderizar();
    inicializarArrastoMotorizado(); 
</script>

</body>
</html>
