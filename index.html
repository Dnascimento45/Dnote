<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dnote</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
   
   <header>
    
    

      <!-- Logo (aparece na dashboard e página 2) -->
      <img src="assets/kanji.svg" alt="Aprendizado" class="site-logo">

    
      <!-- FERRAMENTAS DO CADERNO (ocultas por padrão) -->
      <div id="ferramentas-caderno" class="caderno-tools" style="display: none;">
          <button class="tool-btn" data-tool="desenhar">✏️</button>
          <button class="tool-btn" data-tool="apagar">🧽</button>
          <button class="tool-btn" data-tool="texto">🔤</button>
          <button class="tool-btn" data-tool="salvar">💾</button>
      </div>


    <button id="btn-voltar-header" class="btn-voltar" style="display: none;">

       


    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M19 12H5M12 19l-7-7 7-7" stroke="currentColor" stroke-width="w" stroke-linecap="round" stroke-linejoin="round"/>
        </svg> </button>
   </header>
   <div id="overlay-transicao" class="overlay-transicao"></div>
   
    <div id="app">

        <section id="caderno" class="view-conteudo" style="display: none;">
            <!-- Header do caderno -->
        
        
            <!-- Corpo do caderno (sidebar + canvas) -->
            <div class="caderno-body">
                <!-- Barra lateral -->
                <aside id="sidebar-caderno" class="sidebar">
                    <h2>CAPÍTULOS</h2>
                    <ul id="lista-capitulos"></ul>
                    <div class="sidebar-actions">
                        <button id="btn-add-capitulo" class="btn-sidebar">+ Capítulo</button>
                        <button id="btn-rename-capitulo" class="btn-sidebar">Renomear</button>
                        <button id="btn-delete-capitulo" class="btn-sidebar">Excluir capítulo</button>
                    </div>
                </aside>
        
                <!-- Área de desenho -->
                <div class="canvas-area">
                    <canvas id="canvas-desenho"></canvas>
                </div>
            </div>
        </section>



        <!-- Estrutura inicial fixa no HTML (NÃO depende de fetch) -->
        <section id="dashboard" class="dashboard-capas"></section>
        
        <!-- Estrutura da tela do Livro (vamos adicionar depois, mas já deixa o lugar) -->
        <section id="livro" class="view-conteudo" style="display: none;"></section>
    </div>

    <!-- Corrigido: importando o módulo -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
